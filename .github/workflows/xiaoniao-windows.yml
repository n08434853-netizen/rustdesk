# Build a renamed RustDesk ("XiaoniaoDesk") for Windows x64.
# Only change vs upstream: hbb_common APP_NAME "RustDesk" -> "XiaoniaoDesk",
# so it uses its own config dir (%APPDATA%\XiaoniaoDesk), its own ID and its own IPC pipes,
# and can run (portable) in a second Windows session next to the official RustDesk service.
# No server address / key is baked in; those are set locally.
name: XiaoniaoDesk Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - xiaoniao
    paths:
      - ".github/workflows/xiaoniao-windows.yml"

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  NEW_APP_NAME: "XiaoniaoDesk"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows-x64:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rename app (APP_NAME) to XiaoniaoDesk
        shell: bash
        run: |
          f=libs/hbb_common/src/config.rs
          grep -n 'RwLock::new("RustDesk".to_owned())' "$f"
          sed -i 's/pub static ref APP_NAME: RwLock<String> = RwLock::new("RustDesk".to_owned());/pub static ref APP_NAME: RwLock<String> = RwLock::new("'"$NEW_APP_NAME"'".to_owned());/' "$f"
          grep -n "APP_NAME: RwLock<String>" "$f"
          grep -q "RwLock::new(\"$NEW_APP_NAME\".to_owned())" "$f"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        id: llvm
        continue-on-error: true
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      # GitHub release download of LLVM-15.0.6-win64.exe kept returning 504; fall back to the runner's preinstalled LLVM.
      - name: Fall back to preinstalled LLVM
        if: steps.llvm.outcome == 'failure'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          & "$llvm\clang.exe" --version
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # github.com/.../releases/download/... returns 504 today; the REST API asset endpoint works.
      - name: Replace engine with rustdesk custom flutter engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter doctor -v
          flutter precache --windows
          $id = gh api repos/rustdesk/engine/releases/tags/main --jq '.assets[] | select(.name=="windows-x64-release.zip") | .id'
          Write-Host "engine asset id: $id"
          curl.exe -fL --retry 5 --retry-all-errors -H "Accept: application/octet-stream" -H "Authorization: Bearer $env:GH_TOKEN" -o windows-x64-release.zip "https://api.github.com/repos/rustdesk/engine/releases/assets/$id"
          if ($LASTEXITCODE -ne 0) { throw "engine download failed" }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-xiaoniao

      # run-vcpkg's bootstrap downloads vcpkg.exe from the broken releases/download endpoint,
      # so set vcpkg up by hand: pin the preinstalled C:\vcpkg checkout and fetch vcpkg.exe via the REST API.
      - name: Setup vcpkg (manual, via REST API)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\vcpkg'
          git -C $root fetch --quiet origin $env:VCPKG_COMMIT_ID
          git -C $root checkout -f --quiet $env:VCPKG_COMMIT_ID
          $tag = ((Get-Content "$root\scripts\vcpkg-tool-metadata.txt") | Where-Object { $_ -match '^VCPKG_TOOL_RELEASE_TAG=' }) -replace '^VCPKG_TOOL_RELEASE_TAG=', ''
          Write-Host "vcpkg tool release: $tag"
          $id = gh api "repos/microsoft/vcpkg-tool/releases/tags/$tag" --jq '.assets[] | select(.name=="vcpkg.exe") | .id'
          curl.exe -fL --retry 5 --retry-all-errors -H "Accept: application/octet-stream" -H "Authorization: Bearer $env:GH_TOKEN" -o "$root\vcpkg.exe" "https://api.github.com/repos/microsoft/vcpkg-tool/releases/assets/$id"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg.exe download failed" }
          & "$root\vcpkg.exe" version
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # (No VCPKG_FORCE_SYSTEM_BINARIES: the runner's CMake is too old for this vcpkg's scripts
          #  — string(JSON ... STRING_ENCODE). vcpkg's own CMake/ninja downloads go through the fetch script below.)
          # Route every vcpkg download through a script: github.com/<o>/<r>/releases/download/<tag>/<file>
          # is rewritten to the REST API asset endpoint; everything else is fetched as-is.
          # vcpkg runs x-script with a scrubbed environment, so the token is read from a file, and curl is used instead of gh.
          $env:GH_TOKEN | Out-File -FilePath C:\vcpkg-fetch-token.txt -NoNewline -Encoding ascii
          # Candidates per URL (each result is checked against vcpkg's SHA512 before accepting):
          #   github releases/download -> REST API asset; github archive/<ref> -> codeload.github.com; then the original URL.
          $fetch = @'
          param([string]$url, [string]$dst, [string]$sha)
          $tok = (Get-Content C:\vcpkg-fetch-token.txt -Raw).Trim()
          $dir = Split-Path -Parent $dst
          if ($dir -and -not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          function Get-One([string]$u, [string[]]$hdr) {
            if (Test-Path $dst) { Remove-Item -Force $dst }
            $a = @('-fsSL', '--create-dirs', '--retry', '6', '--retry-delay', '5', '--retry-all-errors', '-o', $dst)
            foreach ($h in $hdr) { $a += @('-H', $h) }
            & curl.exe @a $u
            if ($LASTEXITCODE -ne 0) { Write-Host "[fetch]   failed ($LASTEXITCODE): $u"; return $false }
            if ($sha) {
              $got = (Get-FileHash -Algorithm SHA512 -Path $dst).Hash.ToLower()
              if ($got -ne $sha.ToLower()) { Write-Host "[fetch]   sha512 mismatch: $u"; return $false }
            }
            Write-Host "[fetch]   ok: $u"
            return $true
          }
          Write-Host "[fetch] $url"
          $m = [regex]::Match($url, '^https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^?#]+)$')
          if ($m.Success) {
            $o = $m.Groups[1].Value; $r = $m.Groups[2].Value
            $tag = [uri]::UnescapeDataString($m.Groups[3].Value); $name = [uri]::UnescapeDataString($m.Groups[4].Value)
            $id = $null
            try {
              $rel = curl.exe -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $tok" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$o/$r/releases/tags/$([uri]::EscapeDataString($tag))" | ConvertFrom-Json
              $id = ($rel.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1).id
            } catch { Write-Host "[fetch]   release lookup failed: $_" }
            if ($id -and (Get-One "https://api.github.com/repos/$o/$r/releases/assets/$id" @('Accept: application/octet-stream', "Authorization: Bearer $tok"))) { exit 0 }
          }
          $m = [regex]::Match($url, '^https://github\.com/([^/]+)/([^/]+)/archive/(.+)\.(tar\.gz|zip)$')
          if ($m.Success) {
            $o = $m.Groups[1].Value; $r = $m.Groups[2].Value; $ref = $m.Groups[3].Value
            $kind = if ($m.Groups[4].Value -eq 'zip') { 'zip' } else { 'tar.gz' }
            $refs = @()
            if ($ref -match '^refs/') { $refs += $ref } elseif ($ref -match '^[0-9a-f]{40}$') { $refs += $ref } else { $refs += @("refs/tags/$ref", $ref, "refs/heads/$ref") }
            foreach ($x in $refs) { if (Get-One "https://codeload.github.com/$o/$r/$kind/$x" @()) { exit 0 } }
          }
          if (Get-One $url @()) { exit 0 }
          exit 1
          '@
          Set-Content -Path C:\vcpkg-fetch.ps1 -Value $fetch -Encoding utf8
          "X_VCPKG_ASSET_SOURCES=x-script,pwsh -NoProfile -ExecutionPolicy Bypass -File C:/vcpkg-fetch.ps1 {url} {dst} {sha512}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./xiaoniaodesk
          Get-ChildItem ./xiaoniaodesk | Select-Object Name, Length

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiaoniaodesk-windows-x64
          path: xiaoniaodesk
          retention-days: 14
